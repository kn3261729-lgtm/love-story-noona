<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#21130f"><title>الباب السري | LOVE STORY</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% 25%,#65432f 0,#2a1a14 42%,#100b09 100%);color:#fff1df;font-family:Tahoma,Arial,sans-serif;overflow-x:hidden}.card{width:min(100%,620px);text-align:center;padding:clamp(18px,4vw,34px);border:1px solid #d6ad7c55;border-radius:28px;background:#160f0bdc;box-shadow:0 25px 90px #0008;backdrop-filter:blur(12px)}.eyebrow{color:#e5bd8e;font-size:.9rem}h1{font-size:clamp(1.45rem,5vw,2.3rem);line-height:1.5;margin:10px 0}h1 em{font-style:normal;color:#e6bd8e}.sub{color:#e2cbb5;line-height:1.8}.heart{position:relative;width:min(88vw,430px);height:min(73vw,360px);min-height:230px;margin:12px auto 18px;overflow:hidden}.heart span{position:absolute;transform:translate(-50%,-50%);font-size:clamp(7px,1.9vw,11px);font-weight:900;color:#f2d2a4;text-shadow:0 0 9px #d9a16a;animation:appear .42s both;opacity:0;will-change:transform,opacity}.form{display:grid;gap:10px;text-align:right;max-width:420px;margin:auto}.form label{font-size:.95rem}.wrap{display:flex;gap:8px}.wrap input{min-width:0;flex:1;background:#090706;color:#fff1df;border:1px solid #b68a5d88;border-radius:14px;padding:14px;font-size:1rem;direction:ltr;text-align:left}.wrap button,.submit{border:1px solid #d8b17d66;border-radius:14px;padding:12px;background:#38251a;color:#fff1df}.submit{background:linear-gradient(120deg,#9a6944,#5c3825);font-weight:bold;font-size:1rem}.error{min-height:24px;text-align:center;color:#e8cba7;font-size:.9rem}.foot{font-size:.8rem;color:#c9ae94;margin-top:18px}@keyframes appear{from{opacity:0;transform:translate(-50%,-50%) scale(.5)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@media(max-height:700px){.card{padding:14px}.heart{height:220px;min-height:200px}.eyebrow,.sub{margin:6px 0}.foot{margin-top:8px}}
</style></head><body><main class="card"><p class="eyebrow">✦ حكاية سرّية معمولة مخصوص لنونه ✦</p><h1>بينك وبين قلبي <em>سر صغير</em> يا نونه 🤎</h1><p class="sub">اكتبي كلمة السر، وبعدها هيفتح عالمنا الخاص وتبدأ الحكاية من القلب الكبير.</p><div id="heart" class="heart" aria-label="قلب كبير مكوّن من كلمة LOVE"></div><form id="form" class="form"><label for="pass">🔐 كلمة السر</label><div class="wrap"><input id="pass" type="password" placeholder="اكتبي كلمة السر هنا" autocomplete="off" required><button id="toggle" type="button">👁️</button></div><button class="submit" type="submit">افتحي الحكاية ✨</button><p id="msg" class="error" aria-live="polite">مفتاح الحكاية معاكي 🤎</p></form><p class="foot">LOVE STORY · معمول بحب لنونه 🤎🌹</p></main><script>
(function(){var heart=document.getElementById('heart'),form=document.getElementById('form'),pass=document.getElementById('pass'),msg=document.getElementById('msg');function inside(x,y){var a=x*x+y*y-1;return a*a*a-x*x*y*y*y<=0}function build(){heart.innerHTML='';var cols=25,rows=23;for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){var x=(c-(cols-1)/2)/((cols-1)/2)*1.35,y=1.15-r/(rows-1)*2.25;if(inside(x,y)){var s=document.createElement('span');s.textContent='LOVE';s.style.left=c/(cols-1)*100+'%';s.style.top=r/(rows-1)*100+'%';s.style.animationDelay=(Math.min(18,Math.floor((r+c)/2))*.025)+'s';heart.appendChild(s)}}}build();document.getElementById('toggle').onclick=function(){pass.type=pass.type==='password'?'text':'password'};form.onsubmit=function(e){e.preventDefault();if(pass.value.trim().toLowerCase()==='love'){try{sessionStorage.setItem('noonaLoveUnlocked','1')}catch(e){}location.href='index.html'}else{msg.textContent='كلمة السر مش مظبوطة، جرّبي تاني 🤎';pass.value='';pass.focus()}}})();
</script></body></html>
